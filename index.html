<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>보호자에게 위치 보내기</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; }
    p { line-height: 1.6; }
    .notice {
      background: #fff8d9;
      border-radius: 12px;
      padding: 14px;
      margin: 18px 0;
      font-size: 15px;
      line-height: 1.6;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }
    .primary {
      background: #fee500;
      color: #111;
    }
    .secondary {
      background: #e9e9e9;
      color: #222;
    }
    #status {
      margin-top: 20px;
      line-height: 1.7;
      word-break: break-word;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>보호자에게 위치 보내기</h1>

    <p>
      이 아이가 길을 잃었거나 도움이 필요한 상황일 수 있습니다.
      아래 버튼을 눌러 현재 위치를 보호자에게 문자로 보내주시길 부탁드립니다.
    </p>

    <div class="notice">
      위치 정보는 보호자에게 전달하기 위한 용도로만 사용됩니다.<br>
      전화번호는 화면에 표시되지 않습니다.
    </div>

    <button class="primary" onclick="sendLocationSms()">
      현재 위치 문자로 보내기
    </button>

    <button class="secondary" onclick="callGuardian()">
      보호자에게 전화하기
    </button>

    <div id="status"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFdO8NSeE1QI-YIKsHsMeKtZ3Nws6S5ZjzbuzOiINc6OTG_eeqaoR1_D5cfcuvfKo2/exec";
    const guardianPhone = "01021342733";

    function callGuardian() {
      window.location.href = "tel:" + guardianPhone;
    }

    function sendLocationSms() {
      const status = document.getElementById("status");

      status.innerHTML = "현재 위치를 확인하는 중입니다. 위치 사용을 허용해 주세요.";

      if (!navigator.geolocation) {
        status.innerHTML = "이 기기에서는 위치 기능을 사용할 수 없습니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);

          status.innerHTML = "위치 확인이 완료되었습니다. 보호자에게 문자를 보내는 중입니다.";

          const data = {
            lat: lat,
            lng: lng,
            accuracy: accuracy,
            time: new Date().toISOString(),
            ua: navigator.userAgent
          };

          fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(data)
          })
          .then(function() {
            status.innerHTML =
              "보호자에게 위치 문자를 보냈습니다.<br><br>가능하면 아이와 함께 안전한 장소에서 기다려 주세요.";
          })
          .catch(function(error) {
            status.innerHTML =
              "문자 전송 중 문제가 발생했습니다. 아래 전화 버튼으로 보호자에게 연락해 주세요.";
          });
        },

        function(error) {
          if (error.code === 1) {
            status.innerHTML = "위치 권한이 거부되었습니다. 브라우저 설정에서 위치 권한을 허용해 주세요.";
          } else if (error.code === 2) {
            status.innerHTML = "현재 위치를 확인할 수 없습니다. 잠시 후 다시 시도해 주세요.";
          } else if (error.code === 3) {
            status.innerHTML = "위치 확인 시간이 초과되었습니다. 다시 시도해 주세요.";
          } else {
            status.innerHTML = "위치 확인에 실패했습니다.";
          }
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
