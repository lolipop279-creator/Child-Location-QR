<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>보호자에게 위치 보내기</title>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js"
    crossorigin="anonymous"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }

    .card {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
      font-size: 16px;
    }

    .notice {
      background: #fff6d6;
      padding: 14px;
      border-radius: 12px;
      margin: 18px 0;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }

    .primary {
      background: #fee500;
      color: #111;
    }

    .secondary {
      background: #e9e9e9;
      color: #222;
    }

    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #555;
      word-break: keep-all;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>보호자에게 위치 보내기</h1>

    <p>
      이 아이가 길을 잃었거나 도움이 필요한 상황일 수 있습니다.
      아래 버튼을 눌러 현재 위치를 보호자에게 카카오톡으로 보내주시길 부탁드립니다. 
    </p>

    <div class="notice">
      위치 정보는 보호자에게 전달하기 위한 용도로만 사용됩니다.
      전화번호는 화면에 표시되지 않습니다.
    </div>

    <button class="primary" onclick="sendLocationByKakao()">
      현재 위치 카카오톡으로 보내기
    </button>

    <button class="secondary" onclick="callGuardian()">
      보호자에게 전화하기
    </button>

    <p id="status"></p>
  </div>

  <script>
    Kakao.init("04997f00f9e4a1379c1d99732a8b2611");

    const childName = "남자아이";
    const guardianPhone = "01032798706";

    function callGuardian() {
      window.location.href = "tel:" + guardianPhone;
    }

    function sendLocationByKakao() {
      const status = document.getElementById("status");
      status.innerText = "현재 위치를 확인하는 중입니다. 위치 사용을 허용해 주세요.";

      if (!navigator.geolocation) {
        status.innerText = "이 휴대폰에서는 위치 기능을 사용할 수 없습니다.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);
          const now = new Date().toLocaleString("ko-KR");

          const mapUrl = `https://maps.google.com/?q=${lat},${lng}`;

          Kakao.Share.sendDefault({
            objectType: "text",
            text:
`[아이 위치 알림]

${childName}가 도움이 필요할 수 있습니다.

시간: ${now}
위치 정확도: 약 ${accuracy}m

지도 보기:
${mapUrl}

안내:
아이를 안전한 곳에 머물게 해주시고, 보호자에게 이 메시지를 전달해 주세요.`,
            link: {
              mobileWebUrl: mapUrl,
              webUrl: mapUrl
            },
            buttonTitle: "지도에서 위치 보기"
          });

          status.innerText = "카카오톡 공유창이 열립니다. 보호자에게 전송해 주세요.";
        },
        function(error) {
          status.innerText =
            "위치 확인에 실패했습니다. 위치 권한을 허용했는지 확인해 주세요.";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }
  </script>
  console.log(Kakao.isInitialized());
</body>
</html>
