<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>보호자에게 위치 보내기</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f7f7;
      color: #222;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
    }

    .notice {
      background: #fff8d9;
      border-radius: 12px;
      padding: 14px;
      margin: 18px 0;
      font-size: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #fee500;
      color: #111;
    }

    #result {
      margin-top: 20px;
      line-height: 1.7;
      word-break: break-word;
    }

    a {
      color: #0066cc;
    }
  </style>
</head>

<body>
  <div class="card">

    <h1>보호자에게 위치 보내기</h1>

    <p>
      이 아이가 길을 잃었거나 도움이 필요한 상황일 수 있습니다.
      아래 버튼을 눌러 현재 위치를 보호자에게 카카오톡으로 보내주시길 부탁드립니다.
    </p>

    <div class="notice">
      위치 정보는 보호자에게 전달하기 위한 용도로만 사용됩니다.<br>
      전화번호는 화면에 표시되지 않습니다.
    </div>

    <button onclick="getLocation()">
      현재 위치 확인하기
    </button>

    <div id="result"></div>

  </div>

  <script>

    function getLocation() {

      const result = document.getElementById("result");

      result.innerHTML =
        "현재 위치를 확인하는 중입니다. 위치 사용을 허용해 주세요.";

      if (!navigator.geolocation) {

        result.innerHTML =
          "이 기기에서는 위치 기능을 사용할 수 없습니다.";

        return;
      }

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const accuracy = Math.round(position.coords.accuracy);

          const mapUrl =
            `https://maps.google.com/?q=${lat},${lng}`;

          result.innerHTML = `
            <strong>위치 확인 성공</strong><br><br>

            위도: ${lat}<br>
            경도: ${lng}<br>
            위치 정확도: 약 ${accuracy}m<br><br>

            <a href="${mapUrl}" target="_blank">
              지도에서 위치 확인하기
            </a>

            <br><br>

            <div class="notice">
              카카오톡 공유창이 열립니다.
              보호자에게 전송해 주세요.
            </div>
          `;
        },

        function(error) {

          result.innerHTML =
            "위치 확인에 실패했습니다. 위치 권한을 허용했는지 확인해 주세요.";

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

  </script>

</body>
</html>
